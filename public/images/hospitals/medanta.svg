    <rect x="328" y="150" width="12" height="10" rx="1"/>
    <rect x="328" y="168" width="12" height="10" rx="1"/>
    <rect x="328" y="186" width="12" height="10" rx="1"/>
    <rect x="346" y="150" width="12" height="10" rx="1"/>
