  <!-- Text -->
  <text x="200" y="248" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="700" fill="url(#gold)">Medanta</text>
  <text x="200" y="266" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="rgba(255,255,255,0.45)" letter-spacing="3">THE MEDICITY · GURUGRAM</text>
