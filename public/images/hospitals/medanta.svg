    <rect x="290" y="115" width="18" height="14" rx="1"/>
    <rect x="95" y="140" width="18" height="14" rx="1"/>
    <rect x="120" y="140" width="18" height="14" rx="1"/>
    <rect x="145" y="140" width="18" height="14" rx="1"/>
    <rect x="170" y="140" width="18" height="14" rx="1"/>
    <rect x="215" y="140" width="18" height="14" rx="1"/>
    <rect x="240" y="140" width="18" height="14" rx="1"/>
    <rect x="265" y="140" width="18" height="14" rx="1"/>
    <rect x="290" y="140" width="18" height="14" rx="1"/>
    <rect x="95" y="165" width="18" height="14" rx="1"/>
