    <rect x="145" y="165" width="18" height="14" rx="1"/>
    <rect x="170" y="165" width="18" height="14" rx="1"/>
    <rect x="215" y="165" width="18" height="14" rx="1"/>
    <rect x="240" y="165" width="18" height="14" rx="1"/>
    <rect x="265" y="165" width="18" height="14" rx="1"/>
    <rect x="290" y="165" width="18" height="14" rx="1"/>
